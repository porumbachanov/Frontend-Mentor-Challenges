<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    
    <title>Frontend Mentor | Time tracking dashboard</title>

    <script defer src="cards.js"></script>
  </head>
  <body>
    <main>
      <div class="container" id="container">
        <div class="report-card">
          <div class="report-card-top">
            <img src="images/image-jeremy.png" alt="Jeremy">
            <div class="info">
              <span>Report for</span>
              <h1>Jeremy Robson</h1>
            </div>
          </div>
          <div class="report-card-bottom">
            <ul class="periods">
              <li>
                <button class="period-btn">Daily</button>
              </li>
              <li>
                <button class="period-btn active">Weekly</button>
              </li>
              <li>
                <button class="period-btn">Monthly</button>
              </li>
            </ul>
          </div>
        </div>
    </main>
    
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://www.frontendmentor.io/profile/porumbachanov" target="_blank">Nikola</a>.
    </footer>
  </body>
</html>
